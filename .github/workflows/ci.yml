name: Offline regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check updater failure and merge boundaries
        run: python3 -B -S tests/test_upstream_sync.py
      - name: Check scanner, agent and Python 2.7 grammar
        run: python3 -B -S scripts/check-relay.py .
